<header class="site-header">
  <nav class="navbar" aria-label="Primary navigation">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
    <div class="nav-links">
      {% for item in site.data.navigation.pages %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a>{% endfor %}
    </div>
  </nav>
</header>
