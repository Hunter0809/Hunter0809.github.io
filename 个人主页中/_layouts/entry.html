---
layout: default
---
<article class="entry-page">
  <p class="entry-type">{{ page.collection | capitalize }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.meta %}<p class="entry-meta">{{ page.meta }}</p>{% endif %}
  {{ content }}
  {% if page.links %}<p class="entry-links">{% for link in page.links %}<a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">[{{ link.label }}]</a>{% endfor %}</p>{% endif %}
</article>
